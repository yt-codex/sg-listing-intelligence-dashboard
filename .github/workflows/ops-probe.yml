name: Emit Ops Probe

on:
  push:
    branches: [main]
    paths-ignore:
      - "ops/probe.json"
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-probe
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Emit probe
        run: python scripts/emit_ops_probe.py --output ops/probe.json

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-probe
          path: ops/probe.json
          if-no-files-found: error
