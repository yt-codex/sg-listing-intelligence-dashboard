name: Emit Ops Probe

on:
  push:
    branches: [main]
    paths-ignore:
      - "ops/probe.json"
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-probe
  cancel-in-progress: false

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Emit probe
        run: python scripts/emit_ops_probe.py --output ops/probe.json

      - name: Commit probe
        run: |
          if git diff --quiet -- ops/probe.json; then
            echo "No probe changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/probe.json
          git commit -m "chore: refresh ops probe"
          git push
